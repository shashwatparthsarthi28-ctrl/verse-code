name: Build LUDO X APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find project folder
        id: loc
        run: |
          P=$(find . -name pubspec.yaml -not -path "*/.*" | head -1)
          if [ -z "$P" ]; then
            echo "pubspec.yaml not found - project files were not uploaded"; exit 1
          fi
          echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"
          ls -la "$(dirname "$P")"

      - name: Generate Android project
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          flutter create --platforms=android --project-name ludo_x --org com.ludox .
          flutter pub get
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk *= *[^ ]+/minSdk = 23/' android/app/build.gradle.kts
          else
            sed -i -E 's/minSdkVersion +[^ ]+/minSdkVersion 23/' android/app/build.gradle
          fi
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i -E 's/android:label="[^"]*"/android:label="LUDO X"/' "$M"

      - name: Generate launcher icon
        working-directory: ${{ steps.loc.outputs.dir }}
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Run Dart tests
        working-directory: ${{ steps.loc.outputs.dir }}
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUDO-X-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
